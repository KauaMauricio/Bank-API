
<div class="form-card">
  <div class="form-heading">
    <div>
      <span class="eyebrow">NOVA OPERAÇÃO</span>
      <h3>Agendar transferência</h3>
      <p>Preencha os dados para programar uma transferência.</p>
    </div>
    <div class="form-icon">↗</div>
  </div>

  <form (ngSubmit)="submit()" #transferForm="ngForm">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="sourceAccount" class="form-label">Conta de origem</label>
        <input
          id="sourceAccount"
          name="sourceAccount"
          class="form-control"
          type="text"
          [(ngModel)]="sourceAccount"
          placeholder="Ex.: 12345678"
          required
          maxlength="30"
          [disabled]="loading">
      </div>

      <div class="col-md-6">
        <label for="destinationAccount" class="form-label">Conta de destino</label>
        <input
          id="destinationAccount"
          name="destinationAccount"
          class="form-control"
          type="text"
          [(ngModel)]="destinationAccount"
          placeholder="Ex.: 87654321"
          required
          maxlength="30"
          [disabled]="loading">
      </div>

      <div class="col-md-6">
        <label for="amount" class="form-label">Valor da transferência (R$)</label>
        <input
          id="amount"
          name="amount"
          class="form-control"
          type="number"
          [(ngModel)]="amount"
          placeholder="0,00"
          min="0.01"
          step="0.01"
          required
          [disabled]="loading">
      </div>

      <div class="col-md-6">
        <label for="scheduledDate" class="form-label">Data do agendamento</label>
        <input
          id="scheduledDate"
          name="scheduledDate"
          class="form-control"
          type="date"
          [(ngModel)]="scheduledDate"
          required
          [disabled]="loading">
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success mt-3 mb-0">
      {{ successMessage }}
    </div>

    <div class="form-actions">
      <small>As taxas serão calculadas pela API.</small>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading || transferForm.invalid">
        {{ loading ? 'Agendando...' : 'Agendar transferência' }}
      </button>
    </div>
  </form>
</div>
